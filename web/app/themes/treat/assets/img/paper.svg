<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!--
    Tileable paper texture: transparent mottling, fibres and grain, laid over
    the paper colour token. stitchTiles keeps the edges seamless when repeated.
    Strength is the alpha row of each feColorMatrix (4th value scales, 5th offsets).
    No double hyphens in this comment: they make the XML invalid.
  -->
  <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.48  0 0 0 0 0.42  0 0 0 0 0.32  0 0 0 0.14 -0.045"/>
  </filter>
  <!-- turbulence is near zero along thin ridges: invert it so the ridges become fibres -->
  <filter id="fibres" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="4" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.40  0 0 0 0 0.35  0 0 0 0 0.27  -0.55 0 0 0 0.1"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.25  0 0 0 0 0.22  0 0 0 0 0.18  0 0 0 0.32 -0.12"/>
  </filter>
  <!-- Overall strength: lower this opacity for whiter paper -->
  <g opacity="0.6">
    <rect width="100%" height="100%" filter="url(#mottle)"/>
    <rect width="100%" height="100%" filter="url(#fibres)"/>
    <rect width="100%" height="100%" filter="url(#grain)"/>
  </g>
</svg>
